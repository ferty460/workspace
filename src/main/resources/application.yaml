spring:
  application:
    name: workspace

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    show-sql: true
    open-in-view: false

logging:
  level:
    root: INFO
    com.example.workspace: DEBUG

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-at-least-32-bytes}
  access-token-ttl: PT15M